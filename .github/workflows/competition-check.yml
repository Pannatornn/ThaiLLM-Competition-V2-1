name: Competition Check

on:
  push:
    branches:
      - main
      - final-competition-policy
      - hard-hackathon-10
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt
          pip install pytest
      - name: Compile critical modules
        run: |
          python -m py_compile \
            render_server.py \
            render_app.py \
            src/competition_ai/policy.py \
            src/competition_ai/hard_policy.py \
            src/competition_ai/policy_pipeline.py \
            src/competition_ai/question_import.py \
            src/competition_ai/router.py \
            src/competition_ai/knowledge.py
      - name: Run tests
        run: pytest -q
